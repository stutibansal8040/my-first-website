
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
        }

        header {
            background: #243b80;
            color: white;
            padding: 25px;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            color: #243b80;
            font-size: 40px;
        }

        button {
            background: #243b80;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #243b80;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h2>MY FIRST WEBSITE</h2>
    </header>

    <div class="container">
        <h1>Welcome to My new Website!</h1>

        <p>This is my first website hosted online.</p>

        <button onclick="alert('My website is working!')">
            Click Me
        </button>

        <h3>Website Updates</h3>
        <p id="message">Version 1.0 - Welcome!</p>
    </div>

    <footer>
        Made by Me ❤️
    </footer>

</body>
</html>
